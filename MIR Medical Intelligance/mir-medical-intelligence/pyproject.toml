[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mir-medical"
version = "2.2.0"
description = "Laboratory-First, Adaptive and Extensible Clinical Intelligence Research Program"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Mir AbdulRehman", email = "mir@example.com"},
    {name = "Biomedical Co-Researcher", email = "researcher@example.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "scipy>=1.10.0",
    "pyarrow>=12.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2",
    "torch>=2.0.0",
    "lifelines>=0.27.0",
    "scikit-survival>=0.21.0",
    "shap>=0.42.0",
    "mlflow>=2.5.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
